# Gen-COMPAS TMD phase, protocol A, run by src/gc_md.py (OpenMM stand-in for NAMD).
# Gen-COMPAS rewrites the TMDk and TMDFile lines; everything else is ours.
systemXML     /workspace/gc/systems/A/system.xml
proteinPDB    /workspace/gc/systems/A/equilibrated_protein.pdb
inputState    /workspace/gc/systems/A/start.xml
resetVelocities on
outputName    TMD.A
temperature   310
timestep      4.0
run           125000         # 500 ps heavy-atom TMD (v4; their nAChR template: 100 ps CA)
dcdfreq       2500
cvPair        C,A
TMD           on
TMDk          10000.0
TMDFile       output.pdb
TMDLastStep   125000
TMDFinalRMSD  0.0
